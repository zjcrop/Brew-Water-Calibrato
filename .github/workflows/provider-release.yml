name: Brew Water provider release

on:
  pull_request:
    paths:
      - index.html
      - core/**
      - provider/**
      - scripts/prepare-web.mjs
      - package.json
      - package-lock.json
      - .github/workflows/provider-release.yml
  push:
    branches: [main]
    paths:
      - index.html
      - core/**
      - provider/schemas/**
      - provider/scripts/**
      - provider/tests/**
      - provider/registry-entry.json
      - scripts/prepare-web.mjs
      - package.json
      - package-lock.json
      - .github/workflows/provider-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brew-water-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test deterministic chemistry core
        run: npm run check
      - name: Resolve semantic source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_PATHS=(index.html core provider/scripts provider/schemas provider/tests provider/registry-entry.json package.json package-lock.json scripts/prepare-web.mjs)
          echo "date=$(git log -1 --format=%cI -- "${SOURCE_PATHS[@]}")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git log -1 --format=%H -- "${SOURCE_PATHS[@]}")" >> "$GITHUB_OUTPUT"
      - name: Build and verify candidate provider and app bundle
        shell: bash
        env:
          SOURCE_COMMIT_DATE: ${{ steps.source.outputs.date }}
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/water-provider"
          node provider/scripts/build-provider-release.mjs --output="$RUNNER_TEMP/water-provider"
          node provider/scripts/verify-provider-release.mjs --output="$RUNNER_TEMP/water-provider"
          npm run prepare:web
          test -s www/provider/latest.json
          grep -q "provider-bootstrap.mjs" www/index.html
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync(process.argv[1]));const b=JSON.parse(fs.readFileSync(process.argv[2]));if(a.releaseId!==b.releaseId)throw new Error(`candidate/app release mismatch: ${a.releaseId} != ${b.releaseId}`)' "$RUNNER_TEMP/water-provider/latest.json" www/provider/latest.json
      - name: Publish verified provider release on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SOURCE_COMMIT_DATE: ${{ steps.source.outputs.date }}
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          node provider/scripts/build-provider-release.mjs --write
          node provider/scripts/verify-provider-release.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provider/releases
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(provider): publish verified water release [skip provider]"
          git push
