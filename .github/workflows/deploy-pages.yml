name: Deploy Brew Water Calibrator to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - index.html
      - assets/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify permanent v2.7 source
        run: |
          set -euxo pipefail
          test -s index.html
          grep -q "CUI_LI_V27_TEA_PATCH" index.html
          grep -q "咖啡与茶冲泡调水 配方2.7版" index.html
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          set -euxo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d assets ]; then cp -R assets _site/assets; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
