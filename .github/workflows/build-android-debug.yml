name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - index.html
      - assets/**
      - package.json
      - package-lock.json
      - capacitor.config.json
      - scripts/prepare-web.mjs
      - android/**

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Verify permanent v2.7 source
        run: |
          set -euxo pipefail
          test -s index.html
          test -f android/gradlew
          grep -q "CUI_LI_V27_TEA_PATCH" index.html
          grep -q '"version": "2.7.0"' package.json
          grep -q 'versionCode 20700' android/app/build.gradle
          grep -q 'versionName "2.7.0"' android/app/build.gradle
      - uses: actions/setup-node@v6
        with:
          node-version: "22.16.0"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install npm dependencies with retry
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_audit: "false"
          npm_config_fund: "false"
        run: |
          set -euxo pipefail
          npm config set registry https://registry.npmjs.org/
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund --prefer-online && break
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep $((attempt * 15))
          done
      - name: Prepare and sync web assets
        run: |
          set -euxo pipefail
          npm run prepare:web
          npx --no-install cap sync android
      - name: Install Android SDK 36
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: android
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Prepare artifact
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Brew-Water-Calibrato-v2.7.0-debug.apk
          sha256sum dist/Brew-Water-Calibrato-v2.7.0-debug.apk > dist/SHA256SUMS.txt
          cp TEA_WATER_AUDIT_v2.7.md dist/
      - uses: actions/upload-artifact@v7
        with:
          name: Brew-Water-Calibrato-v2.7.0-debug
          path: dist/
          if-no-files-found: error
          retention-days: 30
