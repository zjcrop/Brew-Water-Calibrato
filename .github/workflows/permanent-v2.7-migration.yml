name: Permanent migrate Brew Water v2.7

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - .github/workflows/permanent-v2.7-migration.yml

permissions:
  contents: write

concurrency:
  group: permanent-v2.7-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify permanent v2.6.1 baseline
        run: |
          set -euxo pipefail
          test -s index.html
          test -f scripts/patch_brew_water_v2_7.py
          grep -q "CUI_LI_V261_PATCH" index.html
          python3 scripts/patch_brew_water_v2_7.py --root . --check

      - name: Apply permanent v2.7 expansion
        run: |
          set -euxo pipefail
          python3 scripts/patch_brew_water_v2_7.py --root . --in-place
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          lock_path=Path('package-lock.json')
          lock=json.loads(lock_path.read_text(encoding='utf-8'))
          lock['version']='2.7.0'
          if '' in lock.get('packages',{}): lock['packages']['']['version']='2.7.0'
          lock_path.write_text(json.dumps(lock,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          gradle_path=Path('android/app/build.gradle')
          gradle=gradle_path.read_text(encoding='utf-8')
          gradle=re.sub(r'versionCode\s+\d+','versionCode 20700',gradle)
          gradle=re.sub(r'versionName\s+"[^"]+"','versionName "2.7.0"',gradle)
          gradle_path.write_text(gradle,encoding='utf-8')
          PY
          grep -q "CUI_LI_V27_TEA_PATCH" index.html
          grep -q "咖啡与茶冲泡调水 配方2.7版" index.html
          grep -q '"version": "2.7.0"' package.json
          grep -q 'versionCode 20700' android/app/build.gradle

      - name: Remove one-time workflow
        run: rm -f .github/workflows/permanent-v2.7-migration.yml

      - name: Commit permanent v2.7 source
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html package.json package-lock.json android/app/build.gradle README.md PATCH_APPLIED_v2.7.txt TEA_WATER_AUDIT_v2.7.md WORKFLOW_CONFIG_v2.7.md .github/workflows scripts/patch_brew_water_v2_7.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Expand Brew Water Calibrator v2.7 with tea profiles"
          git push origin HEAD:main
